<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <meta name="color-scheme" content="dark light" />
  <script>
    // Apply the saved theme before first paint (dark is the default). Keep in sync with ThemeContext.
    (function () {
      try {
        if (localStorage.getItem("portfolio-theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f6f7f9");
        }
      } catch (e) {}
    })();
  </script>
  <title>João Marcos | Full Stack & QA</title>
  <meta name="description"
    content="Portfólio de João Marcos Ribeirete Garbelini: desenvolvedor full stack e QA (automação de testes), aplicando IA em produtos reais." />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://joaomarcosribeiretee.github.io/" />
  <meta property="og:title" content="João Marcos | Full Stack & QA" />
  <meta property="og:description"
    content="Desenvolvedor full stack e QA. React, React Native, Node.js, Python e IA." />
  <meta property="og:image" content="https://joaomarcosribeiretee.github.io/projects/relampago.webp" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="%PUBLIC_URL%/icons/foto.png" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/foto.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@400;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet" />
</head>

<body>
  <noscript>Ative o JavaScript para ver este portfólio.</noscript>
  <div id="root"></div>
</body>

</html>
